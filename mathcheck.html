<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prova d'iframe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    iframe { width: 100%; height: 70vh; border: 1px solid #aaa; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Prova d'iframe</h1>
  <p>Intentant carregar <code>mathcheck.net</code> dins d'un iframe:</p>
  <iframe
    src="https://mathcheck.net/"
    title="MathCheck"
    referrerpolicy="no-referrer">
  </iframe>
</body>
</html>
